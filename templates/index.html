<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISL Translator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">Indian Sign Language Translator</h1>
            <p class="text-gray-600">Speak naturally, see signs instantly</p>
        </div>

        <!-- Main Content -->
        <div class="max-w-4xl mx-auto relative">
            <!-- Analyse Button -->
            <button id="analyseBtn" class="absolute top-0 left-0 px-4 py-2 bg-green-600 text-white font-medium rounded-lg hover:bg-green-700 transition-colors mb-4">
                Analyse
            </button>

            <!-- Status Bar -->
            <div class="mb-6 flex justify-center">
                <div id="statusIndicator" class="px-4 py-2 rounded-full text-sm font-medium bg-gray-100 text-gray-700">
                    Ready to start
                </div>
            </div>

            <!-- Display Area -->
            <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
                <div class="aspect-w-16 aspect-h-9 bg-gray-50 rounded-lg overflow-hidden">
                    <div id="displayArea" class="flex justify-center h-96">
                        <iframe id="signDisplay" class="w-full h-full border-0" src="" frameborder="0" allowfullscreen></iframe>
                        <img id="placeholderImage" class="max-h-full max-w-full object-contain hidden" src="" alt="">
                    </div>
                </div>
            </div>

            <!-- Transcript Area -->
            <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
                <h2 class="text-lg font-semibold mb-4">Transcript</h2>
                <div id="transcript" class="text-gray-700 min-h-[50px] p-4 bg-gray-50 rounded-lg">
                    Waiting for speech...
                </div>
            </div>

            <!-- Controls -->
            <div class="flex justify-center gap-4">
                <button id="startBtn" class="px-8 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition-colors">
                    Start Listening
                </button>
                <button id="stopBtn" class="px-8 py-3 bg-red-600 text-white font-medium rounded-lg hover:bg-red-700 transition-colors" disabled>
                    Stop
                </button>
            </div>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const analyseBtn = document.getElementById('analyseBtn');
        const statusIndicator = document.getElementById('statusIndicator');
        const transcript = document.getElementById('transcript');
        const signDisplay = document.getElementById('signDisplay');
        const placeholderImage = document.getElementById('placeholderImage');

        let isListening = false;
        let statusCheckInterval;

        startBtn.addEventListener('click', async () => {
            try {
                // Request microphone permission
                await navigator.mediaDevices.getUserMedia({ audio: true });

                const response = await fetch('/start', { method: 'POST' });
                if (!response.ok) throw new Error('Failed to start listening');

                isListening = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                updateStatus('Listening...', 'bg-green-100 text-green-800');

                // Start polling for updates
                statusCheckInterval = setInterval(checkStatus, 100);
            } catch (error) {
                console.error('Error:', error);
                updateStatus('Error: ' + error.message, 'bg-red-100 text-red-800');
            }
        });

        stopBtn.addEventListener('click', async () => {
            try {
                await fetch('/stop', { method: 'POST' });
                clearInterval(statusCheckInterval);
                isListening = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                updateStatus('Ready to start', 'bg-gray-100 text-gray-700');
            } catch (error) {
                console.error('Error:', error);
            }
        });

        analyseBtn.addEventListener('click', () => {
            // Add your path analysis logic here
            alert('Analyse button clicked! Add your path analysis logic here.');
        });

        async function checkStatus() {
            try {
                const response = await fetch('/status');
                const data = await response.json();

                if (data.transcript) {
                    transcript.textContent = data.transcript;
                }

                if (data.image) {
                    // Check if the image is a .gif.html file
                    if (data.image.endsWith('.gif.html')) {
                        signDisplay.classList.remove('hidden');
                        placeholderImage.classList.add('hidden');
                        signDisplay.src = data.image;
                    } else {
                        // For regular images, use the img tag
                        signDisplay.classList.add('hidden');
                        placeholderImage.classList.remove('hidden');
                        placeholderImage.src = data.image;
                    }
                }

                if (!data.is_listening) {
                    clearInterval(statusCheckInterval);
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    updateStatus('Ready to start', 'bg-gray-100 text-gray-700');
                }
            } catch (error) {
                console.error('Status check error:', error);
            }
        }

        function updateStatus(message, className) {
            statusIndicator.textContent = message;
            statusIndicator.className = `px-4 py-2 rounded-full text-sm font-medium ${className}`;
        }
    </script>
</body>
</html>
