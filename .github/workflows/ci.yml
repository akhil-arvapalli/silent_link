name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ruff + pytest (model, backend)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [model, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The TS/Python parity tests execute the app's real TypeScript mirrors
      # under Node's native type stripping. Without this they would silently
      # skip and the guard against mirror drift would go unexercised.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip
          pip install -e "${{ matrix.package }}[dev]"

      - name: Ruff
        working-directory: ${{ matrix.package }}
        run: python -m ruff check .

      - name: Pytest
        working-directory: ${{ matrix.package }}
        run: python -m pytest -q

  app:
    name: tsc --noEmit (app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit