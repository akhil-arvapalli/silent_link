[project]
name = "silent-link-model"
version = "0.1.0"
description = "Silent Link v1-prod model: data pipeline + training."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "mediapipe",
    "opencv-python",
    "torch",
    "onnx",
    "onnxruntime",
    "onnxscript",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
